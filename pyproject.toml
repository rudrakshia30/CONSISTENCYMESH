[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "consistencymesh"
version = "0.1.0"
description = "ConsistencyMesh - Multi-modal document and claim consistency validation system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "PyMuPDF>=1.23.0",
    "python-docx>=1.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.26.0",
    "redis>=5.0.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "types-redis>=4.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "SIM",
    "TCH",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"
plugins = [
    "pydantic.mypy",
]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.mypy.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests focusing on isolated components and functions",
    "integration: Integration tests validating interactions between multiple subsystems",
    "security: Security tests verifying auth, injection prevention, and data safety",
    "performance: Performance and benchmark tests assessing latency and throughput",
    "accessibility: Accessibility and compliance tests",
    "e2e: End-to-end workflow tests across full stack execution",
    "live_api: Tests that interact with live external APIs like Gemini",
]

[tool.coverage.run]
source = ["backend"]

[tool.coverage.report]
show_missing = true
fail_under = 60
